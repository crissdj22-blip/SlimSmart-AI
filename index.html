<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SlimSmart AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #FAF8F1;
      color: #26332D;
      text-align: center;
    }

    header {
      background: #174C3A;
      color: white;
      padding: 35px 15px;
    }

    h1 {
      margin: 10px 0;
    }

    .card {
      background: white;
      margin: 20px;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 12px #00000015;
    }

    button {
      background: #69B87A;
      color: #174C3A;
      border: none;
      padding: 15px 25px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <h1>🌿 SlimSmart AI</h1>
    <p>Slăbește inteligent. Mănâncă echilibrat.</p>
  </header>

  <div class="card">
    <h2>Bine ai venit!</h2>
    <p>Planul tău alimentar personalizat începe aici.</p>
    <button>Începe acum</button>
  </div>

  <div class="card">
    <h2>🥗 Plan alimentar</h2>
    <p>Meniuri zilnice și calorii calculate.</p>
  </div>

  <div class="card">
    <h2>🛒 Lista de cumpărături</h2>
    <p>Organizează mesele și economisește bani.</p>
  </div>

  <div class="card">
    <h2>📊 Progresul meu</h2>
    <p>Urmărește evoluția greutății tale.</p>
  </div>

</body>
</html>
